
name: Build Virtual Camera APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare project
        run: |
          if [ -f VirtualCameraSimulator-AndroidStudio-Project.zip ]; then
            unzip -o VirtualCameraSimulator-AndroidStudio-Project.zip
          fi

          if [ -f VirtualCameraSimulator/settings.gradle ]; then
            echo "PROJECT_DIR=VirtualCameraSimulator" >> "$GITHUB_ENV"
          elif [ -f settings.gradle ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "Project files not found"
            exit 1
          fi

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Virtual-Camera-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          
